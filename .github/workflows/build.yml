name: Build and Package

# Phase-A hardening (Task 4): action pinning status.
# Fully pinned to commit SHA:
#   - softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
# TODO(phase-a): pin the following first-party actions to commit SHAs once verified
# from the official repos (use `git ls-remote` or the GitHub API refs/tags/<tag> endpoint):
#   - actions/checkout@v6
#   - actions/setup-dotnet@v5
#   - actions/upload-artifact@v7
#   - actions/download-artifact@v8
#   - actions/cache@v5
# These remain tag-pinned in this pass because the tag SHAs were not
# independently verified in this change. Bumping majors without SHA pins keeps
# the supply-chain risk consistent with prior behavior; do not weaken further.
#
# Node runtime migration note:
#   - first-party actions in this workflow were upgraded from Node 20-backed
#     majors to Node 24-backed majors to proactively avoid Node 20 deprecation
#     warnings in GitHub-hosted runners.
#
# Phase-A hardening (Task 3, round 3): the prereq download steps no longer carry
# hardcoded URL + SHA-256 pins. Resolution + verification is delegated to
# tools/FreeAiSsd.PrereqFetch, which shares PrereqResolver with PrepApp so CI
# and the runtime updater use a single implementation. See README "Prereq trust
# model" for the per-upstream trust basis.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 0.2.0)"
        required: true
        type: string
      include_macos:
        description: "Include macOS artifacts"
        required: false
        default: false
        type: boolean

# Phase-A hardening (Task 4): workflow inherits the restrictive read-only default.
# Only the `package-release` job elevates to `contents: write`, and only for its
# release-creation steps. See job-level `permissions:` below.

env:
  MAC_SIGNING_ENABLED: "false"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore FreeAiSsd.sln
      - run: dotnet build FreeAiSsd.sln -c Release --no-restore
      - run: dotnet test FreeAiSsd.sln -c Release --no-build
      - name: Compile WPF apps (guard rail)
        run: |
          dotnet build prep-app/FreeAiSsd.PrepApp.csproj -c Release --no-restore -v:minimal
          dotnet build runner/FreeAiSsd.Runner.csproj -c Release --no-restore -v:minimal
      - name: Stage runner publish into prep-app
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64
      - name: Publish PrepApp
        shell: pwsh
        run: dotnet publish prep-app/FreeAiSsd.PrepApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o out/prepapp-publish
      - name: Publish Companion
        shell: pwsh
        run: dotnet publish companion/FreeAiSsd.Companion.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o out/companion-publish
      # Phase-A hardening: the previous CI path pinned hardcoded URL + SHA-256
      # pairs per prereq. That required human maintenance every upstream bump
      # and produced long-lived TODOs whenever a hash wasn't independently
      # verifiable from the authoring environment. We now delegate the entire
      # resolve + download + verify flow to tools/FreeAiSsd.PrereqFetch, which
      # shares the PrereqResolver implementation with PrepApp so the two paths
      # cannot drift. Trust model per upstream is documented in the shared
      # resolver (SHA-512 for .NET, SHA-256 for Ollama, HTTPS-only aka.ms for
      # VC++). The tool fails closed on any network/parse/hash error.
      #
      # actions/cache@v5 caches the downloaded installers across runs so that
      # repeated dispatches of the same latest-stable upstream don't re-download
      # the Microsoft / GitHub assets. Cache key is intentionally date-scoped so
      # a new upstream release is picked up within 24h even if the key otherwise
      # matches; the fail-closed verify still runs on every resolve.
      - name: Compute prereq cache key (UTC date)
        if: github.event_name == 'workflow_dispatch'
        id: prereq-cache-key
        shell: pwsh
        run: |
          # Cache buckets installed installers per-UTC-day. Repeated dispatches
          # in the same day reuse the cached binaries; the first dispatch of a
          # new day re-resolves + re-verifies via PrereqResolver. This keeps the
          # cache useful while still picking up new Microsoft / GitHub releases
          # within 24h.
          $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          "date=$today" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache offline Windows prerequisites
        if: github.event_name == 'workflow_dispatch'
        id: cache-windows-prereqs
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: out/windows/tools/prereqs
          key: windows-prereqs-v2-${{ runner.os }}-${{ steps.prereq-cache-key.outputs.date }}
          restore-keys: |
            windows-prereqs-v2-${{ runner.os }}-

      - name: Cache macOS Ollama archive
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        id: cache-mac-ollama
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: out/mac/tools/ollama
          key: mac-ollama-v2-${{ runner.os }}-${{ steps.prereq-cache-key.outputs.date }}
          restore-keys: |
            mac-ollama-v2-${{ runner.os }}-

      - name: Resolve + verify macOS Ollama (runtime discovery)
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false') && steps.cache-mac-ollama.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Single source of truth: tools/FreeAiSsd.PrereqFetch calls the same
          # PrereqResolver used by PrepApp. Any upstream drift surfaces here,
          # not in a parallel PowerShell reimplementation.
          dotnet run --project tools/FreeAiSsd.PrereqFetch/FreeAiSsd.PrereqFetch.csproj -c Release -- --kind mac-ollama --out out/mac/tools/ollama
          if (-not $?) { throw "Ollama resolve/fetch step failed." }

      - name: Resolve + verify offline Windows prerequisites (runtime discovery)
        if: github.event_name == 'workflow_dispatch' && steps.cache-windows-prereqs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          dotnet run --project tools/FreeAiSsd.PrereqFetch/FreeAiSsd.PrereqFetch.csproj -c Release -- --kind windows --out out/windows/tools/prereqs
          if (-not $?) { throw "Windows prereq resolve/fetch step failed." }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-build-output
          path: |
            out/prepapp-publish
            out/companion-publish
            prep-app/bin/Release/net8.0-windows/runner-publish
            out/windows/tools/prereqs
            out/mac/tools/ollama
            out/mac/runner-host
            docs/QUICKSTART.txt
            LICENSE

  mac-runner-build:
    if: github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.include_macos || 'false')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - name: Run Swift unit tests (SsdEncryption)
        # MAC5: smoke-test the Swift port of SsdEncryption (PBKDF2-SHA256
        # vector, AES-GCM roundtrip, two-file atomic commit, plaintext
        # migration, key-zeroize) and the cross-language fixture before we
        # build Runner.app. If this binary fails, encryption is broken and
        # the runner has no business shipping.
        run: |
          mkdir -p out
          swiftc mac-runner/Sources/SsdEncryption.swift mac-runner/Tests/SsdEncryptionTests.swift             -parse-as-library             -target "arm64-apple-macos11.0"             -O             -o out/ssd-encryption-tests
          FREE_AI_SSD_REPO="$GITHUB_WORKSPACE" out/ssd-encryption-tests
      - name: Publish mac-runner-host (osx-arm64 self-contained single-file)
        # MAC6: build the net8.0 sidecar host so the Swift Runner.app can spawn
        # it. Self-contained so end users don't need a system .NET 8 install
        # — the SSD payload is the source of truth. PublishTrimmed=false is
        # set in the csproj because RunnerCore minimal-API endpoint
        # registration relies on reflection that PublishTrimmed silently
        # breaks.
        run: |
          dotnet publish mac-runner-host/FreeAiSsd.MacRunnerHost.csproj             -c Release -r osx-arm64 --self-contained true             /p:PublishSingleFile=true
      - name: Build runner-core + runner-cli (cross-platform sanity)
        # MAC6: confirm the platform-neutral .NET surface compiles on macOS
        # so any future RAG / streaming / CLI work catches portability
        # regressions at this gate. We do NOT build the full solution
        # because prep-app/runner/companion are net8.0-windows and need
        # Windows targeting packs that don't ship for macOS.
        run: |
          dotnet build runner-core/FreeAiSsd.RunnerCore.csproj -c Release --verbosity minimal
          dotnet build runner-cli/FreeAiSsd.RunnerCli.csproj -c Release --verbosity minimal
          dotnet build mac-runner-host/FreeAiSsd.MacRunnerHost.csproj -c Release --verbosity minimal
      - name: Run mac-runner-host smoke (spawn binary; /api/health + /api/chat)
        # MAC6: end-to-end smoke that spawns the published mac-runner-host,
        # writes a known handshake on stdin, hits /api/health and /api/chat
        # over loopback, and asserts the host exits cleanly when stdin
        # closes. Uses jq + curl rather than a shim xUnit project to keep
        # the Mac CI footprint small (the full tests project pulls in WPF
        # runner / prep-app sources via Compile Include and won't build on
        # macOS).
        run: |
          set -euo pipefail
          HOST_BIN="$GITHUB_WORKSPACE/mac-runner-host/bin/Release/net8.0/osx-arm64/publish/FreeAiSsd.MacRunnerHost"
          if [ ! -x "$HOST_BIN" ]; then
            echo "Published mac-runner-host not found at $HOST_BIN" >&2
            exit 1
          fi

          WORK="$(mktemp -d)"
          mkdir -p "$WORK/logs" "$WORK/config"

          # Pick a high random port. Loopback bind so concurrent runs are isolated.
          # Range 50000-59999 keeps clear of the IANA registered range.
          PORT=$(( ( RANDOM % 10000 ) + 50000 ))
          echo "Smoke port: $PORT"

          HANDSHAKE="{ \"ssdRoot\": \"$WORK\", \"ollamaHost\": \"127.0.0.1:11434\", \"config\": { \"networkModeEnabled\": true, \"networkBindAddress\": \"127.0.0.1\", \"networkPort\": $PORT, \"networkRequireApiKey\": false, \"networkApiKey\": \"\", \"networkAllowTts\": false, \"networkAllowRemoteStt\": false, \"networkAllowRemoteVoiceQuery\": false, \"networkMaxAudioUploadMB\": 10, \"models\": [{\"name\":\"phi3\",\"status\":\"Installed\"}] } }"

          STDOUT_LOG="$WORK/host-stdout.log"
          STDERR_LOG="$WORK/host-stderr.log"

          # Pipe handshake on stdin, hold stdin open with `cat` so we can
          # send shutdown later. Use a FIFO for control of stdin.
          FIFO="$WORK/stdin.fifo"
          mkfifo "$FIFO"
          # Keep FIFO open; we'll cat the handshake then later "shutdown".
          ( "$HOST_BIN" --test-mode <"$FIFO" >"$STDOUT_LOG" 2>"$STDERR_LOG" ) &
          HOST_PID=$!

          # Open FIFO writer and keep it open via fd 9.
          exec 9>"$FIFO"
          printf '%s\n' "$HANDSHAKE" >&9

          # Wait for "ready: <baseUrl>" on stdout.
          BASE_URL=""
          for i in $(seq 1 60); do
            if [ -f "$STDOUT_LOG" ] && grep -q '^ready: ' "$STDOUT_LOG"; then
              BASE_URL="$(grep '^ready: ' "$STDOUT_LOG" | head -n1 | sed 's/^ready: //')"
              break
            fi
            sleep 0.5
          done

          if [ -z "$BASE_URL" ]; then
            echo "Host never reported ready. stderr:" >&2
            cat "$STDERR_LOG" >&2 || true
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Host ready at $BASE_URL"

          curl -fsS "$BASE_URL/api/health" | tee "$WORK/health.json"
          curl -fsS -H 'Content-Type: application/json' -d '{"model":"phi3","prompt":"ping"}' "$BASE_URL/api/chat" | tee "$WORK/chat.json"
          grep -q 'test-mode' "$WORK/chat.json"

          # Clean shutdown via stdin.
          printf 'shutdown\n' >&9
          exec 9>&-

          # Wait for graceful exit.
          for i in $(seq 1 20); do
            if ! kill -0 "$HOST_PID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$HOST_PID" 2>/dev/null; then
            echo "Host did not exit after shutdown" >&2
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$HOST_PID" || EXIT=$?
          : "${EXIT:=0}"
          if [ "$EXIT" -ne 0 ]; then
            echo "Host exited with non-zero status: $EXIT" >&2
            cat "$STDERR_LOG" >&2 || true
            exit 1
          fi
          echo "MAC6 host smoke passed."
      - name: Build Runner.app bundle
        run: |
          mkdir -p out/Runner.app/Contents/MacOS out/Runner.app/Contents/Resources
          swiftc mac-runner/Sources/SsdEncryption.swift mac-runner/Sources/MacRunnerHostController.swift mac-runner/Sources/main.swift             -parse-as-library             -target "arm64-apple-macos11.0"             -O             -o out/Runner.app/Contents/MacOS/Runner             -framework SwiftUI             -framework AppKit
          # Bundle the published mac-runner-host binary into Resources/runner-host/
          # so the Swift app can locate it via Bundle.main.resourceURL when the
          # Runner.app is launched directly (e.g. dev or ad-hoc test). The SSD
          # production layout still places the host under <ssdRoot>/mac/runner-host/.
          mkdir -p out/Runner.app/Contents/Resources/runner-host
          cp -R mac-runner-host/bin/Release/net8.0/osx-arm64/publish/* out/Runner.app/Contents/Resources/runner-host/
          chmod +x out/Runner.app/Contents/Resources/runner-host/FreeAiSsd.MacRunnerHost
          cp assets/icon/AppIcon.icns out/Runner.app/Contents/Resources/AppIcon.icns
          cat > out/Runner.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>Runner</string>
              <key>CFBundleIdentifier</key><string>com.freeaissd.runner</string>
              <key>CFBundleName</key><string>Free AI SSD</string>
              <key>CFBundleDisplayName</key><string>Free AI SSD</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
              <key>LSRequiresNativeExecution</key><true/>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSHumanReadableCopyright</key><string>Copyright (c) 2026 Free-AI-SSD project</string>
          </dict>
          </plist>
          PLIST
          chmod +x out/Runner.app/Contents/MacOS/Runner
      - name: Verify Runner.app bundle layout
        run: |
          set -e
          test -f out/Runner.app/Contents/Resources/AppIcon.icns || { echo "AppIcon.icns missing from bundle Resources" >&2; exit 1; }
          plutil -lint out/Runner.app/Contents/Info.plist
          icon_key=$(plutil -extract CFBundleIconFile raw out/Runner.app/Contents/Info.plist)
          if [ "$icon_key" != "AppIcon" ]; then
            echo "Info.plist CFBundleIconFile = '$icon_key' (expected 'AppIcon')" >&2
            exit 1
          fi
          # Round-trip the .icns through iconutil to confirm it has the standard size set
          # macOS expects in a shipped app icon.
          iconutil --convert iconset --output /tmp/icns-check.iconset out/Runner.app/Contents/Resources/AppIcon.icns
          for needed in icon_16x16.png icon_16x16@2x.png icon_32x32.png icon_32x32@2x.png \
                        icon_128x128.png icon_128x128@2x.png icon_256x256.png icon_256x256@2x.png \
                        icon_512x512.png icon_512x512@2x.png; do
            test -f "/tmp/icns-check.iconset/$needed" || { echo "iconset missing $needed" >&2; exit 1; }
          done
          rm -rf /tmp/icns-check.iconset
          echo "Runner.app bundle layout OK."
      # Signing is intentionally disabled until Apple cert + notarization pipeline is ready.
      - name: Import signing certificate
        if: github.event_name == 'workflow_dispatch' && env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
      - name: Sign app
        if: github.event_name == 'workflow_dispatch' && env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --sign "$MACOS_SIGN_IDENTITY" out/Runner.app
      - name: Notarize and staple app
        if: github.event_name == 'workflow_dispatch' && env.MAC_SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
          xcrun notarytool submit out/Runner.app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple out/Runner.app
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
      - name: Package Runner.app zip artifact
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-runner-artifact
          path: out/Runner.app.zip

  mac-prep-build:
    if: github.event_name != 'workflow_dispatch' || fromJSON(github.event.inputs.include_macos || 'false')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json
      - name: Run Swift unit tests (DiskutilFormatCommand + PrepFlowStep)
        # MAC17: pure-builder parity-pin tests for the Mac PrepApp. The same
        # argv shape is unit-tested from C# (DiskutilFormatCommandTests.cs)
        # in the windows-build lane — both sides must agree, so any drift
        # fails CI before reaching destructive disk code.
        run: |
          mkdir -p out
          swiftc mac-prep-app/Sources/PrepFlowStep.swift mac-prep-app/Sources/DiskutilFormatCommand.swift mac-prep-app/Tests/PrepAppTests.swift             -parse-as-library             -target "arm64-apple-macos11.0"             -O             -o out/mac-prep-tests
          out/mac-prep-tests
      - name: Publish mac-prep-host (osx-arm64 self-contained single-file)
        # MAC17: build the net8.0 sidecar host so the Swift PrepApp.app can
        # spawn it. Self-contained so end users don't need a system .NET 8
        # install. PublishTrimmed=false is set in the csproj because
        # prep-core's StarterModelCatalogLoader uses reflection-based
        # embedded-resource lookup that PublishTrimmed silently breaks.
        run: |
          dotnet publish mac-prep-host/FreeAiSsd.MacPrepHost.csproj             -c Release -r osx-arm64 --self-contained true             /p:PublishSingleFile=true
      - name: Build prep-core + mac-prep-host (cross-platform sanity)
        # MAC17: confirm the platform-neutral .NET surface compiles on macOS.
        # We do NOT build the full solution because prep-app/runner/companion
        # are net8.0-windows and need Windows targeting packs that don't
        # ship for macOS.
        run: |
          dotnet build prep-core/FreeAiSsd.PrepCore.csproj -c Release --verbosity minimal
          dotnet build mac-prep-host/FreeAiSsd.MacPrepHost.csproj -c Release --verbosity minimal
      - name: Run mac-prep-host smoke (spawn binary; handshake → readiness → shutdown)
        # MAC17: end-to-end smoke that spawns the published mac-prep-host
        # in --test-mode (so commands return synthetic OK results without
        # needing real artifacts or a running Ollama), pipes a known
        # handshake on stdin, sends the readiness command, and asserts a
        # clean shutdown via stdin close. Mirrors the mac-runner-host smoke
        # bash but for the prep sidecar's stdin command surface.
        run: |
          set -euo pipefail
          HOST_BIN="$GITHUB_WORKSPACE/mac-prep-host/bin/Release/net8.0/osx-arm64/publish/FreeAiSsd.MacPrepHost"
          if [ ! -x "$HOST_BIN" ]; then
            echo "Published mac-prep-host not found at $HOST_BIN" >&2
            exit 1
          fi

          WORK="$(mktemp -d)"
          mkdir -p "$WORK/logs" "$WORK/config"

          HANDSHAKE="{ \"ssdRoot\": \"$WORK\", \"ollamaHost\": \"http://127.0.0.1:11434\" }"

          STDOUT_LOG="$WORK/host-stdout.log"
          STDERR_LOG="$WORK/host-stderr.log"

          FIFO="$WORK/stdin.fifo"
          mkfifo "$FIFO"
          ( "$HOST_BIN" --test-mode <"$FIFO" >"$STDOUT_LOG" 2>"$STDERR_LOG" ) &
          HOST_PID=$!

          # Hold FIFO open via fd 9 so the host stays alive between commands.
          exec 9>"$FIFO"
          printf '%s\n' "$HANDSHAKE" >&9

          # Wait for "ready" line.
          READY=""
          for i in $(seq 1 60); do
            if [ -f "$STDOUT_LOG" ] && grep -q '^ready' "$STDOUT_LOG"; then
              READY=1
              break
            fi
            sleep 0.5
          done
          if [ -z "$READY" ]; then
            echo "Host never reported ready. stderr:" >&2
            cat "$STDERR_LOG" >&2 || true
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          fi
          echo "Host ready."

          # Send readiness command and wait for the result line.
          printf 'readiness\n' >&9
          for i in $(seq 1 30); do
            if grep -q '^result: readiness ' "$STDOUT_LOG"; then
              break
            fi
            sleep 0.3
          done
          grep -q '^result: readiness ' "$STDOUT_LOG" || {
            echo "readiness result not received." >&2
            cat "$STDOUT_LOG" >&2
            cat "$STDERR_LOG" >&2
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          }
          # The synthetic test-mode payload must contain the testMode flag.
          grep -q '"testMode":true' "$STDOUT_LOG" || {
            echo "readiness result missing testMode flag." >&2
            cat "$STDOUT_LOG" >&2
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          }

          # Clean shutdown via stdin close.
          printf 'shutdown\n' >&9
          exec 9>&-

          for i in $(seq 1 20); do
            if ! kill -0 "$HOST_PID" 2>/dev/null; then break; fi
            sleep 0.25
          done
          if kill -0 "$HOST_PID" 2>/dev/null; then
            echo "Host did not exit after shutdown" >&2
            kill "$HOST_PID" 2>/dev/null || true
            exit 1
          fi
          wait "$HOST_PID" || EXIT=$?
          : "${EXIT:=0}"
          if [ "$EXIT" -ne 0 ]; then
            echo "Host exited with non-zero status: $EXIT" >&2
            cat "$STDERR_LOG" >&2 || true
            exit 1
          fi
          echo "MAC17 prep-host smoke passed."
      - name: Build PrepApp.app bundle
        # MAC17: assemble the SwiftUI PrepApp.app bundle. SsdEncryption.swift
        # is reused from mac-runner via shared swiftc input — see the MAC5
        # decision; no duplication, no module boundary needed.
        run: |
          mkdir -p out/PrepApp.app/Contents/MacOS out/PrepApp.app/Contents/Resources
          swiftc             mac-runner/Sources/SsdEncryption.swift             mac-prep-app/Sources/PrepFlowStep.swift             mac-prep-app/Sources/BrandColors.swift             mac-prep-app/Sources/DiskutilFormatCommand.swift             mac-prep-app/Sources/DiskutilDriveService.swift             mac-prep-app/Sources/PrepHostController.swift             mac-prep-app/Sources/EncryptedConfigWriter.swift             mac-prep-app/Sources/PrepViewModel.swift             mac-prep-app/Sources/main.swift             -parse-as-library             -target "arm64-apple-macos11.0"             -O             -o out/PrepApp.app/Contents/MacOS/PrepApp             -framework SwiftUI             -framework AppKit
          # Bundle the published mac-prep-host binary into Resources/prep-host/
          # so PrepHostController can locate it via Bundle.main.resourceURL
          # when PrepApp.app is launched directly (e.g. dev, ad-hoc test, or
          # before the first SSD is staged).
          mkdir -p out/PrepApp.app/Contents/Resources/prep-host
          cp -R mac-prep-host/bin/Release/net8.0/osx-arm64/publish/* out/PrepApp.app/Contents/Resources/prep-host/
          chmod +x out/PrepApp.app/Contents/Resources/prep-host/FreeAiSsd.MacPrepHost
          cp assets/icon/AppIcon.icns out/PrepApp.app/Contents/Resources/AppIcon.icns
          # MAC17 Info.plist mirrors the MAC10b Runner.app keys per the user's
          # call ("copy it makes things make sense"). One product, two apps,
          # consistent metadata.
          cat > out/PrepApp.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>PrepApp</string>
              <key>CFBundleIdentifier</key><string>com.freeaissd.prepapp</string>
              <key>CFBundleName</key><string>Free AI SSD Prep</string>
              <key>CFBundleDisplayName</key><string>Free AI SSD Prep</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
              <key>LSRequiresNativeExecution</key><true/>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSHumanReadableCopyright</key><string>Copyright (c) 2026 Free-AI-SSD project</string>
          </dict>
          </plist>
          PLIST
          chmod +x out/PrepApp.app/Contents/MacOS/PrepApp
      - name: Verify PrepApp.app bundle layout
        run: |
          set -e
          test -f out/PrepApp.app/Contents/Resources/AppIcon.icns || { echo "AppIcon.icns missing from bundle Resources" >&2; exit 1; }
          test -x out/PrepApp.app/Contents/Resources/prep-host/FreeAiSsd.MacPrepHost || { echo "prep-host binary missing or not executable" >&2; exit 1; }
          plutil -lint out/PrepApp.app/Contents/Info.plist
          icon_key=$(plutil -extract CFBundleIconFile raw out/PrepApp.app/Contents/Info.plist)
          if [ "$icon_key" != "AppIcon" ]; then
            echo "Info.plist CFBundleIconFile = '$icon_key' (expected 'AppIcon')" >&2
            exit 1
          fi
          # Pin the executable name + bundle id so a future rename forces
          # an explicit decision rather than silent drift.
          exe=$(plutil -extract CFBundleExecutable raw out/PrepApp.app/Contents/Info.plist)
          if [ "$exe" != "PrepApp" ]; then
            echo "Info.plist CFBundleExecutable = '$exe' (expected 'PrepApp')" >&2
            exit 1
          fi
          bundle_id=$(plutil -extract CFBundleIdentifier raw out/PrepApp.app/Contents/Info.plist)
          if [ "$bundle_id" != "com.freeaissd.prepapp" ]; then
            echo "Info.plist CFBundleIdentifier = '$bundle_id' (expected 'com.freeaissd.prepapp')" >&2
            exit 1
          fi
          echo "PrepApp.app bundle layout OK."
      - name: Package PrepApp.app zip artifact
        run: |
          ditto -c -k --keepParent out/PrepApp.app out/PrepApp.app.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-prep-artifact
          path: out/PrepApp.app.zip

  package-release:
    runs-on: windows-latest
    needs: [windows-build, mac-runner-build, mac-prep-build]
    # Phase-A hardening: entire release-assembly job is gated to workflow_dispatch
    # runs. PR and push-to-main builds stop at the windows-build / mac-runner-build
    # jobs. This matches the gating on "Download offline Windows prerequisites" and
    # "Download macOS ollama runtime for staging" (which produce the payloads this
    # job copies from `in/windows/out/windows` and `in/windows/out/mac/tools`). If
    # those upstream steps are gated to dispatch but this job is not, the job
    # fails on PRs with "Cannot find path ... out/windows".
    #
    # IMPORTANT: the leading `!cancelled() &&` is required, not cosmetic. Without
    # it, GitHub Actions' default "any-need-skipped -> cascade-skip" behavior
    # kicks in before the if: expression is evaluated, so when mac-runner-build
    # is skipped (include_macos=false, the common case for Windows-only releases)
    # this job was silently skipped too. `!cancelled()` overrides the cascade so
    # the explicit `needs.mac-runner-build.result == 'skipped'` branch below can
    # actually take effect. We intentionally use !cancelled() rather than
    # always() so a user-cancelled workflow does NOT create a release.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.windows-build.result == 'success' && (needs.mac-runner-build.result == 'success' || needs.mac-runner-build.result == 'skipped') && (needs.mac-prep-build.result == 'success' || needs.mac-prep-build.result == 'skipped') }}
    # Phase-A hardening (Task 4): scoped write permission ONLY on the release job.
    # The "Create Release" / "Upload beta ZIP to release" steps below gate themselves
    # to workflow_dispatch, so the write scope is only exercised on manual release runs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-build-output
          path: in/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: mac-runner-artifact
          path: in/mac
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: mac-prep-artifact
          path: in/mac-prep
      - name: Assemble distributables
        shell: pwsh
        run: |
          $winRoot = "out_win"
          $payloadRoot = Join-Path $winRoot "payload"
          New-Item -ItemType Directory -Path $winRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          # Stage PrepApp publish output at ZIP root so the app launches with all
          # required sidecar files from the same directory users open after unzip.
          # Keep payload/ for runner + companion + prereq assets only.
          Copy-Item "in/windows/out/prepapp-publish/*" $winRoot -Recurse -Force
          Copy-Item "in/windows/prep-app/bin/Release/net8.0-windows/runner-publish" (Join-Path $payloadRoot "runner-publish") -Recurse -Force
          Copy-Item "in/windows/out/companion-publish" (Join-Path $payloadRoot "companion") -Recurse -Force
          @"
          {
            "schemaVersion": 1,
            "hostAddress": "",
            "hostPort": 41555,
            "apiKey": "",
            "pttBinding": "",
            "inputDeviceName": null,
            "outputDeviceName": null,
            "autoReconnect": true
          }
          "@ | Set-Content -Path (Join-Path $payloadRoot "companion/companion-config.json") -Encoding UTF8
          Copy-Item "in/windows/out/windows" (Join-Path $payloadRoot "windows") -Recurse -Force

          # Defensive guard: payload/ must not ship a second PrepApp exe.
          if (Test-Path (Join-Path $payloadRoot "FreeAiSsd.PrepApp.exe")) {
            Remove-Item (Join-Path $payloadRoot "FreeAiSsd.PrepApp.exe") -Force
          }
          Copy-Item "in/windows/docs/QUICKSTART.txt" (Join-Path $winRoot "QUICKSTART.txt") -Force
          Copy-Item "in/windows/LICENSE" (Join-Path $winRoot "LICENSE") -Force

          if (Test-Path (Join-Path $winRoot "mac")) {
            Remove-Item (Join-Path $winRoot "mac") -Recurse -Force
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.include_macos }}' -eq 'true') {
            $betaRoot = "out_beta"
            Copy-Item $winRoot $betaRoot -Recurse -Force
            New-Item -ItemType Directory -Path (Join-Path $betaRoot "payload/mac") -Force | Out-Null
            Copy-Item "in/mac/Runner.app.zip" (Join-Path $betaRoot "payload/mac/Runner.app.zip") -Force
            # MAC17: ship PrepApp.app.zip alongside Runner.app.zip — two
            # apps, mirroring Windows (per the user's call). The shared
            # MAC10b icon means both apps look like one product family.
            if (Test-Path "in/mac-prep/PrepApp.app.zip") {
              Copy-Item "in/mac-prep/PrepApp.app.zip" (Join-Path $betaRoot "payload/mac/PrepApp.app.zip") -Force
            }
            Copy-Item "in/windows/out/mac/tools" (Join-Path $betaRoot "payload/mac/tools") -Recurse -Force
            # MAC6: ship the cross-published net8.0 sidecar host alongside Runner.app.
            # The Swift app resolves the binary via this path on a staged SSD.
            if (Test-Path "in/windows/out/mac/runner-host") {
              Copy-Item "in/windows/out/mac/runner-host" (Join-Path $betaRoot "payload/mac/runner-host") -Recurse -Force
            }

            $macManifest = [ordered]@{
              schemaVersion = 1
              artifacts = @(
                [ordered]@{ id = "mac_runner"; relativePath = "mac/Runner.app.zip" },
                [ordered]@{ id = "mac_prep_app"; relativePath = "mac/PrepApp.app.zip" },
                [ordered]@{ id = "mac_ollama"; relativePath = "mac/tools/ollama/ollama-darwin.zip" },
                [ordered]@{ id = "mac_ollama_manifest"; relativePath = "mac/tools/ollama/mac-tools-manifest.json" },
                [ordered]@{ id = "mac_runner_host"; relativePath = "mac/runner-host/FreeAiSsd.MacRunnerHost" }
              )
            }
            $macManifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $betaRoot "payload/mac/mac-artifacts.manifest.json") -Encoding UTF8
          }
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path out_win/* -DestinationPath dist/Free-AI-SSD-win.zip -Force
      - name: Create beta ZIP
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        shell: pwsh
        run: Compress-Archive -Path out_beta/* -DestinationPath dist/Free-AI-SSD-beta-crossplatform.zip -Force
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Free-AI-SSD-win
          path: dist/Free-AI-SSD-win.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: Free-AI-SSD-beta-crossplatform
          path: dist/Free-AI-SSD-beta-crossplatform.zip
      - name: Validate release payload
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Free-AI-SSD-win.zip")) {
            throw "Missing required release asset: dist/Free-AI-SSD-win.zip"
          }

          $tmp = Join-Path $env:RUNNER_TEMP "free-ai-ssd-win-zip-check"
          if (Test-Path $tmp) {
            Remove-Item $tmp -Recurse -Force
          }
          Expand-Archive -Path "dist/Free-AI-SSD-win.zip" -DestinationPath $tmp -Force
          if (Test-Path (Join-Path $tmp "payload/FreeAiSsd.PrepApp.exe")) {
            throw "Invalid release payload: duplicate payload/FreeAiSsd.PrepApp.exe found."
          }

          if ('${{ fromJSON(github.event.inputs.include_macos || 'false') }}' -eq 'true' -and -not (Test-Path "dist/Free-AI-SSD-beta-crossplatform.zip")) {
            throw "Missing required beta release asset: dist/Free-AI-SSD-beta-crossplatform.zip"
          }
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        # Phase-A hardening (Task 4): pinned to full commit SHA of the v2 tag
        # (softprops/action-gh-release v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65).
        # When bumping, resolve the new SHA via `git ls-remote` or the GitHub API
        # (refs/tags/<tag>) and update this comment + pin together.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-win.zip
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Upload beta ZIP to release
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        # Phase-A hardening (Task 4): same pin as above (softprops/action-gh-release v2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-beta-crossplatform.zip
          overwrite_files: true
          fail_on_unmatched_files: true
