name: Build and Package

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FreeAiSsd.sln

      - name: Build
        run: dotnet build FreeAiSsd.sln -c Release --no-restore

      - name: Stage runner publish into prep-app
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      - name: Publish PrepApp
        shell: pwsh
        run: dotnet publish prep-app/FreeAiSsd.PrepApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o out/prepapp-publish

      - name: Download offline prerequisites
        shell: pwsh
        run: |
          $prereqDir = "out/tools/prereqs"
          New-Item -ItemType Directory -Path $prereqDir -Force | Out-Null

          $prereqs = @(
            @{ id = "vcredist_x64"; displayName = "Microsoft Visual C++ Redistributable (x64)"; sourceUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"; filename = "vc_redist.x64.exe"; silentArgs = "/install /quiet /norestart"; requiresAdmin = $true; isOptional = $false },
            @{ id = "dotnet8_desktop_x64"; displayName = ".NET 8 Windows Desktop Runtime (x64)"; sourceUrl = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.18/windowsdesktop-runtime-8.0.18-win-x64.exe"; filename = "windowsdesktop-runtime-8-win-x64.exe"; silentArgs = "/install /quiet /norestart"; requiresAdmin = $true; isOptional = $true }
          )

          $manifestEntries = @()
          foreach ($prereq in $prereqs) {
            $target = Join-Path $prereqDir $prereq.filename
            Invoke-WebRequest -Uri $prereq.sourceUrl -OutFile $target -UseBasicParsing

            if (!(Test-Path $target)) {
              throw "Failed to download prereq '$($prereq.id)'"
            }

            $hash = (Get-FileHash -Path $target -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item $target).Length
            $manifestEntries += [ordered]@{
              id = $prereq.id
              displayName = $prereq.displayName
              filename = $prereq.filename
              sourceUrl = $prereq.sourceUrl
              downloadedAtUtc = [DateTime]::UtcNow.ToString("o")
              sha256 = $hash
              sizeBytes = $size
              silentArgs = $prereq.silentArgs
              requiresAdmin = $prereq.requiresAdmin
              isOptional = $prereq.isOptional
            }
          }

          [ordered]@{ prerequisites = $manifestEntries } | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $prereqDir "prereqs-manifest.json") -Encoding UTF8

      - name: Assemble distributable
        shell: pwsh
        run: |
          $runnerPublishDir = "prep-app/bin/Release/net8.0-windows/runner-publish"
          if (!(Test-Path $runnerPublishDir)) {
            throw "runner-publish folder is missing at '$runnerPublishDir'. Ensure build.ps1 completed and staged runner artifacts."
          }

          if (!(Test-Path (Join-Path $runnerPublishDir "FreeAiSsd.Runner.exe"))) {
            throw "runner-publish was found, but FreeAiSsd.Runner.exe is missing from '$runnerPublishDir'."
          }

          $distRoot = "dist/Free-AI-SSD"
          New-Item -ItemType Directory -Path $distRoot -Force | Out-Null

          Copy-Item "out/prepapp-publish/*" $distRoot -Recurse -Force
          Copy-Item $runnerPublishDir (Join-Path $distRoot "runner-publish") -Recurse -Force
          Copy-Item "docs/QUICKSTART.txt" (Join-Path $distRoot "QUICKSTART.txt") -Force
          Copy-Item "out/tools" (Join-Path $distRoot "tools") -Recurse -Force
          Copy-Item "LICENSE" (Join-Path $distRoot "LICENSE") -Force

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/Free-AI-SSD/* -DestinationPath dist/Free-AI-SSD.zip -Force

      - name: Verify ZIP exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/Free-AI-SSD.zip")) {
            Write-Error "ZIP not found!"
            exit 1
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Free-AI-SSD-win-x64
          path: dist/Free-AI-SSD.zip

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: dist/Free-AI-SSD.zip

      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== out/prepapp-publish ==="
          if (Test-Path "out/prepapp-publish") {
            Get-ChildItem "out/prepapp-publish" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "(missing)"
          }

          Write-Host "=== prep-app/bin/Release/net8.0-windows/runner-publish ==="
          if (Test-Path "prep-app/bin/Release/net8.0-windows/runner-publish") {
            Get-ChildItem "prep-app/bin/Release/net8.0-windows/runner-publish" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "(missing)"
          }

          Write-Host "=== dist ==="
          if (Test-Path "dist") {
            Get-ChildItem "dist" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "(missing)"
          }
