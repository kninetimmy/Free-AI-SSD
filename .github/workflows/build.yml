name: Build and Package

# Phase-A hardening (Task 4): action pinning status.
# Fully pinned to commit SHA:
#   - softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
# TODO(phase-a): pin the following first-party actions to commit SHAs once verified
# from the official repos (use `git ls-remote` or the GitHub API refs/tags/<tag> endpoint):
#   - actions/checkout@v4
#   - actions/setup-dotnet@v4
#   - actions/upload-artifact@v4
#   - actions/download-artifact@v4
# These remain tag-pinned in this pass because their v4 tag SHAs were not
# independently verified in this change. Bumping them without SHA pins keeps
# the supply-chain risk consistent with prior behavior; do not weaken further.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 0.2.0)"
        required: true
        type: string
      include_macos:
        description: "Include macOS artifacts"
        required: false
        default: false
        type: boolean

# Phase-A hardening (Task 4): workflow inherits the restrictive read-only default.
# Only the `package-release` job elevates to `contents: write`, and only for its
# release-creation steps. See job-level `permissions:` below.

env:
  MAC_SIGNING_ENABLED: "false"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FreeAiSsd.sln
      - run: dotnet build FreeAiSsd.sln -c Release --no-restore
      - run: dotnet test FreeAiSsd.sln -c Release --no-build
      - name: Compile WPF apps (guard rail)
        run: |
          dotnet build prep-app/FreeAiSsd.PrepApp.csproj -c Release --no-restore -v:minimal
          dotnet build runner/FreeAiSsd.Runner.csproj -c Release --no-restore -v:minimal
      - name: Stage runner publish into prep-app
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64
      - name: Publish PrepApp
        shell: pwsh
        run: dotnet publish prep-app/FreeAiSsd.PrepApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o out/prepapp-publish
      - name: Download macOS ollama runtime for staging
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        shell: pwsh
        run: |
          # Phase-A hardening (Task 3): verify every downloaded prereq against a
          # hardcoded SHA-256. The workflow fails the job on mismatch or when the
          # expected hash is empty. No more "trust whatever we downloaded" + record.
          #
          # TODO(phase-a): pin the exact versioned ollama-darwin.zip URL and its
          # SHA-256. Do NOT use /releases/latest/. Required inputs, both from the
          # official Ollama release page (https://github.com/ollama/ollama/releases):
          #   1. The versioned asset URL for ollama-darwin.zip for a chosen pin
          #      (e.g. https://github.com/ollama/ollama/releases/download/v0.20.7/ollama-darwin.zip).
          #   2. The SHA-256 of that exact asset, copied from the release page's
          #      "Assets" section or from a signed checksums file. Do not guess.
          # Until both are provided, the step below fails the job (fail-closed).
          $expectedSha256 = ""   # TODO(phase-a): fill in once verified; keep lowercase hex.
          $pinnedUrl = ""        # TODO(phase-a): e.g. https://github.com/ollama/ollama/releases/download/vX.Y.Z/ollama-darwin.zip

          if ([string]::IsNullOrWhiteSpace($pinnedUrl) -or [string]::IsNullOrWhiteSpace($expectedSha256)) {
            throw "ollama-darwin.zip is not pinned. Populate `$pinnedUrl and `$expectedSha256 in .github/workflows/build.yml before running this workflow with include_macos=true."
          }

          $macDir = "out/mac/tools/ollama"
          New-Item -ItemType Directory -Path $macDir -Force | Out-Null
          $archive = Join-Path $macDir "ollama-darwin.zip"
          Invoke-WebRequest -Uri $pinnedUrl -OutFile $archive -UseBasicParsing
          $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256.ToLowerInvariant()) {
            throw "SHA-256 mismatch for ollama-darwin.zip. Expected: $expectedSha256 Actual: $actualSha256"
          }
          [ordered]@{ id="ollama_macos_universal"; sourceUrl=$pinnedUrl; archive="ollama-darwin.zip"; sha256=$expectedSha256.ToLowerInvariant(); verifiedAtUtc=[DateTime]::UtcNow.ToString("o") } | ConvertTo-Json | Set-Content -Path (Join-Path $macDir "mac-tools-manifest.json") -Encoding UTF8

      - name: Download offline Windows prerequisites
        shell: pwsh
        run: |
          # Phase-A hardening (Task 3): each prereq has a hardcoded expected SHA-256.
          # Jobs fail on mismatch or when the expected hash is empty. The manifest
          # records only verified hashes — the observed hash is never written as-is.
          #
          # TODO(phase-a): pin versioned URL + SHA-256 for each prereq below.
          # Required inputs for vcredist_x64:
          #   - Replace https://aka.ms/vs/17/release/vc_redist.x64.exe (rolling) with
          #     the absolute versioned URL from
          #     https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist
          #     (e.g. https://download.visualstudio.microsoft.com/download/pr/<guid>/<hash>/VC_redist.x64.exe).
          #   - SHA-256 of that exact asset, copied from Microsoft's published
          #     checksum or computed once under a trusted environment and audited.
          # Required inputs for dotnet8_desktop_x64:
          #   - The SHA-256 for windowsdesktop-runtime-8.0.18-win-x64.exe from
          #     https://builds.dotnet.microsoft.com/dotnet/checksums/8.0.18-sha.txt
          #     (the URL currently used, https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.18/windowsdesktop-runtime-8.0.18-win-x64.exe,
          #     is already versioned and stable, so only a hash is required).
          # Until an entry has both sourceUrl and expectedSha256 populated, the step
          # throws.
          $prereqs = @(
            @{
              id = "vcredist_x64"
              displayName = "Microsoft Visual C++ Redistributable (x64)"
              sourceUrl = ""  # TODO(phase-a): pin exact versioned URL (no aka.ms rolling link)
              expectedSha256 = ""  # TODO(phase-a): lowercase hex SHA-256 of the pinned asset
              filename = "vc_redist.x64.exe"
              silentArgs = "/install /quiet /norestart"
              requiresAdmin = $true
              isOptional = $false
            },
            @{
              id = "dotnet8_desktop_x64"
              displayName = ".NET 8 Windows Desktop Runtime (x64)"
              sourceUrl = "https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.18/windowsdesktop-runtime-8.0.18-win-x64.exe"
              expectedSha256 = ""  # TODO(phase-a): fill in from 8.0.18-sha.txt checksum file
              filename = "windowsdesktop-runtime-8-win-x64.exe"
              silentArgs = "/install /quiet /norestart"
              requiresAdmin = $true
              isOptional = $true
            }
          )

          $prereqDir = "out/windows/tools/prereqs"
          New-Item -ItemType Directory -Path $prereqDir -Force | Out-Null
          $manifestEntries = @()
          foreach ($prereq in $prereqs) {
            if ([string]::IsNullOrWhiteSpace($prereq.sourceUrl) -or [string]::IsNullOrWhiteSpace($prereq.expectedSha256)) {
              throw "Prereq '$($prereq.id)' is not pinned. Populate sourceUrl and expectedSha256 in .github/workflows/build.yml before running this workflow."
            }
            $target = Join-Path $prereqDir $prereq.filename
            Invoke-WebRequest -Uri $prereq.sourceUrl -OutFile $target -UseBasicParsing
            $actualSha256 = (Get-FileHash -Path $target -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $prereq.expectedSha256.ToLowerInvariant()
            if ($actualSha256 -ne $expected) {
              throw "SHA-256 mismatch for $($prereq.id). Expected: $expected Actual: $actualSha256"
            }
            $size = (Get-Item $target).Length
            $manifestEntries += [ordered]@{
              id = $prereq.id
              displayName = $prereq.displayName
              filename = $prereq.filename
              sourceUrl = $prereq.sourceUrl
              verifiedAtUtc = [DateTime]::UtcNow.ToString("o")
              sha256 = $expected
              sizeBytes = $size
              silentArgs = $prereq.silentArgs
              requiresAdmin = $prereq.requiresAdmin
              isOptional = $prereq.isOptional
            }
          }
          [ordered]@{ prerequisites = $manifestEntries } | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $prereqDir "prereqs-manifest.json") -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: |
            out/prepapp-publish
            prep-app/bin/Release/net8.0-windows/runner-publish
            out/windows/tools/prereqs
            out/mac/tools/ollama
            docs/QUICKSTART.txt
            LICENSE

  mac-runner-build:
    if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Runner.app bundle
        run: |
          mkdir -p out/Runner.app/Contents/MacOS out/Runner.app/Contents/Resources
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TARGET_ARCH="$(uname -m)"
          swiftc mac-runner/Sources/main.swift             -parse-as-library             -sdk "$SDK_PATH"             -target "$TARGET_ARCH-apple-macos12.0"             -O             -o out/Runner.app/Contents/MacOS/Runner             -framework SwiftUI             -framework AppKit
          cat > out/Runner.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>Runner</string><key>CFBundleIdentifier</key><string>com.freeaissd.runner</string><key>CFBundleName</key><string>Runner</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>LSMinimumSystemVersion</key><string>12.0</string></dict></plist>
          PLIST
          chmod +x out/Runner.app/Contents/MacOS/Runner
      # Signing is intentionally disabled until Apple cert + notarization pipeline is ready.
      - name: Import signing certificate
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
      - name: Sign app
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --sign "$MACOS_SIGN_IDENTITY" out/Runner.app
      - name: Notarize and staple app
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
          xcrun notarytool submit out/Runner.app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple out/Runner.app
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
      - name: Package Runner.app zip artifact
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-runner-artifact
          path: out/Runner.app.zip

  package-release:
    runs-on: windows-latest
    needs: [windows-build, mac-runner-build]
    if: always() && needs.windows-build.result == 'success' && (needs.mac-runner-build.result == 'success' || needs.mac-runner-build.result == 'skipped')
    # Phase-A hardening (Task 4): scoped write permission ONLY on the release job.
    # The "Create Release" / "Upload beta ZIP to release" steps below gate themselves
    # to workflow_dispatch, so the write scope is only exercised on manual release runs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-output
          path: in/windows
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: mac-runner-artifact
          path: in/mac
      - name: Assemble distributables
        shell: pwsh
        run: |
          $winRoot = "out_win"
          $payloadRoot = Join-Path $winRoot "payload"
          New-Item -ItemType Directory -Path $winRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          Copy-Item "in/windows/out/prepapp-publish/*" $payloadRoot -Recurse -Force
          Copy-Item "in/windows/prep-app/bin/Release/net8.0-windows/runner-publish" (Join-Path $payloadRoot "runner-publish") -Recurse -Force
          Copy-Item "in/windows/out/windows" (Join-Path $payloadRoot "windows") -Recurse -Force

          Copy-Item (Join-Path $payloadRoot "FreeAiSsd.PrepApp.exe") (Join-Path $winRoot "FreeAiSsd.PrepApp.exe") -Force
          Copy-Item "in/windows/docs/QUICKSTART.txt" (Join-Path $winRoot "QUICKSTART.txt") -Force
          Copy-Item "in/windows/LICENSE" (Join-Path $winRoot "LICENSE") -Force

          if (Test-Path (Join-Path $winRoot "mac")) {
            Remove-Item (Join-Path $winRoot "mac") -Recurse -Force
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.include_macos }}' -eq 'true') {
            $betaRoot = "out_beta"
            Copy-Item $winRoot $betaRoot -Recurse -Force
            New-Item -ItemType Directory -Path (Join-Path $betaRoot "payload/mac") -Force | Out-Null
            Copy-Item "in/mac/Runner.app.zip" (Join-Path $betaRoot "payload/mac/Runner.app.zip") -Force
            Copy-Item "in/windows/out/mac/tools" (Join-Path $betaRoot "payload/mac/tools") -Recurse -Force

            $macManifest = [ordered]@{
              schemaVersion = 1
              artifacts = @(
                [ordered]@{ id = "mac_runner"; relativePath = "mac/Runner.app.zip" },
                [ordered]@{ id = "mac_ollama"; relativePath = "mac/tools/ollama/ollama-darwin.zip" },
                [ordered]@{ id = "mac_ollama_manifest"; relativePath = "mac/tools/ollama/mac-tools-manifest.json" }
              )
            }
            $macManifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $betaRoot "payload/mac/mac-artifacts.manifest.json") -Encoding UTF8
          }
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path out_win/* -DestinationPath dist/Free-AI-SSD-win.zip -Force
      - name: Create beta ZIP
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        shell: pwsh
        run: Compress-Archive -Path out_beta/* -DestinationPath dist/Free-AI-SSD-beta-crossplatform.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Free-AI-SSD-win
          path: dist/Free-AI-SSD-win.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: Free-AI-SSD-beta-crossplatform
          path: dist/Free-AI-SSD-beta-crossplatform.zip
      - name: Validate release payload
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Free-AI-SSD-win.zip")) {
            throw "Missing required release asset: dist/Free-AI-SSD-win.zip"
          }

          if ('${{ fromJSON(github.event.inputs.include_macos || 'false') }}' -eq 'true' -and -not (Test-Path "dist/Free-AI-SSD-beta-crossplatform.zip")) {
            throw "Missing required beta release asset: dist/Free-AI-SSD-beta-crossplatform.zip"
          }
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        # Phase-A hardening (Task 4): pinned to full commit SHA of the v2 tag
        # (softprops/action-gh-release v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65).
        # When bumping, resolve the new SHA via `git ls-remote` or the GitHub API
        # (refs/tags/<tag>) and update this comment + pin together.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-win.zip
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Upload beta ZIP to release
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        # Phase-A hardening (Task 4): same pin as above (softprops/action-gh-release v2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-beta-crossplatform.zip
          overwrite_files: true
          fail_on_unmatched_files: true
