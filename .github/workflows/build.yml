name: Build and Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore ./FreeAiSsd.sln

      - name: Build and stage runner with build.ps1
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64

      - name: Publish PrepApp (win-x64)
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'out/prepapp-publish'
          dotnet publish ./prep-app/FreeAiSsd.PrepApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publishDir `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:ContinuousIntegrationBuild=true

      - name: Compute package names
        id: package-names
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*.*.*') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $version = $shortSha
          }

          $zipName = "Free-AI-SSD-$version-win-x64.zip"
          $artifactName = "Free-AI-SSD-$version-win-x64"

          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create distribution zip
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'out/prepapp-publish'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist/Free-AI-SSD'
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "dist/$env:ZIP_NAME"

          if (Test-Path $distRoot) {
            Remove-Item $distRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $distRoot -Force | Out-Null

          Copy-Item (Join-Path $publishDir '*') $distRoot -Recurse -Force
          Copy-Item ./docs/QUICKSTART.txt (Join-Path $distRoot 'QUICKSTART.txt') -Force

          if (Test-Path ./LICENSE) {
            Copy-Item ./LICENSE (Join-Path $distRoot 'LICENSE') -Force
          }

          if (Test-Path ./README.md) {
            Copy-Item ./README.md (Join-Path $distRoot 'README.md') -Force
          }

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path (Join-Path $distRoot '*') -DestinationPath $zipPath -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true
