name: Build and Package

# Phase-A hardening (Task 4): action pinning status.
# Fully pinned to commit SHA:
#   - softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
# TODO(phase-a): pin the following first-party actions to commit SHAs once verified
# from the official repos (use `git ls-remote` or the GitHub API refs/tags/<tag> endpoint):
#   - actions/checkout@v4
#   - actions/setup-dotnet@v4
#   - actions/upload-artifact@v4
#   - actions/download-artifact@v4
#   - actions/cache@v4
# These remain tag-pinned in this pass because their v4 tag SHAs were not
# independently verified in this change. Bumping them without SHA pins keeps
# the supply-chain risk consistent with prior behavior; do not weaken further.
#
# Phase-A hardening (Task 3, round 3): the prereq download steps no longer carry
# hardcoded URL + SHA-256 pins. Resolution + verification is delegated to
# tools/FreeAiSsd.PrereqFetch, which shares PrereqResolver with PrepApp so CI
# and the runtime updater use a single implementation. See README "Prereq trust
# model" for the per-upstream trust basis.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (example: 0.2.0)"
        required: true
        type: string
      include_macos:
        description: "Include macOS artifacts"
        required: false
        default: false
        type: boolean

# Phase-A hardening (Task 4): workflow inherits the restrictive read-only default.
# Only the `package-release` job elevates to `contents: write`, and only for its
# release-creation steps. See job-level `permissions:` below.

env:
  MAC_SIGNING_ENABLED: "false"

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FreeAiSsd.sln
      - run: dotnet build FreeAiSsd.sln -c Release --no-restore
      - run: dotnet test FreeAiSsd.sln -c Release --no-build
      - name: Compile WPF apps (guard rail)
        run: |
          dotnet build prep-app/FreeAiSsd.PrepApp.csproj -c Release --no-restore -v:minimal
          dotnet build runner/FreeAiSsd.Runner.csproj -c Release --no-restore -v:minimal
      - name: Stage runner publish into prep-app
        shell: pwsh
        run: ./build.ps1 -Configuration Release -Runtime win-x64
      - name: Publish PrepApp
        shell: pwsh
        run: dotnet publish prep-app/FreeAiSsd.PrepApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o out/prepapp-publish
      # Phase-A hardening: the previous CI path pinned hardcoded URL + SHA-256
      # pairs per prereq. That required human maintenance every upstream bump
      # and produced long-lived TODOs whenever a hash wasn't independently
      # verifiable from the authoring environment. We now delegate the entire
      # resolve + download + verify flow to tools/FreeAiSsd.PrereqFetch, which
      # shares the PrereqResolver implementation with PrepApp so the two paths
      # cannot drift. Trust model per upstream is documented in the shared
      # resolver (SHA-512 for .NET, SHA-256 for Ollama, HTTPS-only aka.ms for
      # VC++). The tool fails closed on any network/parse/hash error.
      #
      # actions/cache@v4 caches the downloaded installers across runs so that
      # repeated dispatches of the same latest-stable upstream don't re-download
      # the Microsoft / GitHub assets. Cache key is intentionally date-scoped so
      # a new upstream release is picked up within 24h even if the key otherwise
      # matches; the fail-closed verify still runs on every resolve.
      - name: Compute prereq cache key (UTC date)
        if: github.event_name == 'workflow_dispatch'
        id: prereq-cache-key
        shell: pwsh
        run: |
          # Cache buckets installed installers per-UTC-day. Repeated dispatches
          # in the same day reuse the cached binaries; the first dispatch of a
          # new day re-resolves + re-verifies via PrereqResolver. This keeps the
          # cache useful while still picking up new Microsoft / GitHub releases
          # within 24h.
          $today = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
          "date=$today" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache offline Windows prerequisites
        if: github.event_name == 'workflow_dispatch'
        id: cache-windows-prereqs
        uses: actions/cache@v4
        with:
          path: out/windows/tools/prereqs
          key: windows-prereqs-v2-${{ runner.os }}-${{ steps.prereq-cache-key.outputs.date }}
          restore-keys: |
            windows-prereqs-v2-${{ runner.os }}-

      - name: Cache macOS Ollama archive
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        id: cache-mac-ollama
        uses: actions/cache@v4
        with:
          path: out/mac/tools/ollama
          key: mac-ollama-v2-${{ runner.os }}-${{ steps.prereq-cache-key.outputs.date }}
          restore-keys: |
            mac-ollama-v2-${{ runner.os }}-

      - name: Resolve + verify macOS Ollama (runtime discovery)
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false') && steps.cache-mac-ollama.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Single source of truth: tools/FreeAiSsd.PrereqFetch calls the same
          # PrereqResolver used by PrepApp. Any upstream drift surfaces here,
          # not in a parallel PowerShell reimplementation.
          dotnet run --project tools/FreeAiSsd.PrereqFetch/FreeAiSsd.PrereqFetch.csproj -c Release -- --kind mac-ollama --out out/mac/tools/ollama
          if (-not $?) { throw "Ollama resolve/fetch step failed." }

      - name: Resolve + verify offline Windows prerequisites (runtime discovery)
        if: github.event_name == 'workflow_dispatch' && steps.cache-windows-prereqs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          dotnet run --project tools/FreeAiSsd.PrereqFetch/FreeAiSsd.PrereqFetch.csproj -c Release -- --kind windows --out out/windows/tools/prereqs
          if (-not $?) { throw "Windows prereq resolve/fetch step failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: |
            out/prepapp-publish
            prep-app/bin/Release/net8.0-windows/runner-publish
            out/windows/tools/prereqs
            out/mac/tools/ollama
            docs/QUICKSTART.txt
            LICENSE

  mac-runner-build:
    if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Runner.app bundle
        run: |
          mkdir -p out/Runner.app/Contents/MacOS out/Runner.app/Contents/Resources
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          TARGET_ARCH="$(uname -m)"
          swiftc mac-runner/Sources/main.swift             -parse-as-library             -sdk "$SDK_PATH"             -target "$TARGET_ARCH-apple-macos12.0"             -O             -o out/Runner.app/Contents/MacOS/Runner             -framework SwiftUI             -framework AppKit
          cat > out/Runner.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>Runner</string><key>CFBundleIdentifier</key><string>com.freeaissd.runner</string><key>CFBundleName</key><string>Runner</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleShortVersionString</key><string>1.0</string><key>LSMinimumSystemVersion</key><string>12.0</string></dict></plist>
          PLIST
          chmod +x out/Runner.app/Contents/MacOS/Runner
      # Signing is intentionally disabled until Apple cert + notarization pipeline is ready.
      - name: Import signing certificate
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
      - name: Sign app
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --sign "$MACOS_SIGN_IDENTITY" out/Runner.app
      - name: Notarize and staple app
        if: env.MAC_SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
          xcrun notarytool submit out/Runner.app.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple out/Runner.app
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip
      - name: Package Runner.app zip artifact
        run: |
          ditto -c -k --keepParent out/Runner.app out/Runner.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-runner-artifact
          path: out/Runner.app.zip

  package-release:
    runs-on: windows-latest
    needs: [windows-build, mac-runner-build]
    # Phase-A hardening: entire release-assembly job is gated to workflow_dispatch
    # runs. PR and push-to-main builds stop at the windows-build / mac-runner-build
    # jobs. This matches the gating on "Download offline Windows prerequisites" and
    # "Download macOS ollama runtime for staging" (which produce the payloads this
    # job copies from `in/windows/out/windows` and `in/windows/out/mac/tools`). If
    # those upstream steps are gated to dispatch but this job is not, the job
    # fails on PRs with "Cannot find path ... out/windows".
    if: github.event_name == 'workflow_dispatch' && needs.windows-build.result == 'success' && (needs.mac-runner-build.result == 'success' || needs.mac-runner-build.result == 'skipped')
    # Phase-A hardening (Task 4): scoped write permission ONLY on the release job.
    # The "Create Release" / "Upload beta ZIP to release" steps below gate themselves
    # to workflow_dispatch, so the write scope is only exercised on manual release runs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-output
          path: in/windows
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: mac-runner-artifact
          path: in/mac
      - name: Assemble distributables
        shell: pwsh
        run: |
          $winRoot = "out_win"
          $payloadRoot = Join-Path $winRoot "payload"
          New-Item -ItemType Directory -Path $winRoot -Force | Out-Null
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          Copy-Item "in/windows/out/prepapp-publish/*" $payloadRoot -Recurse -Force
          Copy-Item "in/windows/prep-app/bin/Release/net8.0-windows/runner-publish" (Join-Path $payloadRoot "runner-publish") -Recurse -Force
          Copy-Item "in/windows/out/windows" (Join-Path $payloadRoot "windows") -Recurse -Force

          Copy-Item (Join-Path $payloadRoot "FreeAiSsd.PrepApp.exe") (Join-Path $winRoot "FreeAiSsd.PrepApp.exe") -Force
          Copy-Item "in/windows/docs/QUICKSTART.txt" (Join-Path $winRoot "QUICKSTART.txt") -Force
          Copy-Item "in/windows/LICENSE" (Join-Path $winRoot "LICENSE") -Force

          if (Test-Path (Join-Path $winRoot "mac")) {
            Remove-Item (Join-Path $winRoot "mac") -Recurse -Force
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.include_macos }}' -eq 'true') {
            $betaRoot = "out_beta"
            Copy-Item $winRoot $betaRoot -Recurse -Force
            New-Item -ItemType Directory -Path (Join-Path $betaRoot "payload/mac") -Force | Out-Null
            Copy-Item "in/mac/Runner.app.zip" (Join-Path $betaRoot "payload/mac/Runner.app.zip") -Force
            Copy-Item "in/windows/out/mac/tools" (Join-Path $betaRoot "payload/mac/tools") -Recurse -Force

            $macManifest = [ordered]@{
              schemaVersion = 1
              artifacts = @(
                [ordered]@{ id = "mac_runner"; relativePath = "mac/Runner.app.zip" },
                [ordered]@{ id = "mac_ollama"; relativePath = "mac/tools/ollama/ollama-darwin.zip" },
                [ordered]@{ id = "mac_ollama_manifest"; relativePath = "mac/tools/ollama/mac-tools-manifest.json" }
              )
            }
            $macManifest | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $betaRoot "payload/mac/mac-artifacts.manifest.json") -Encoding UTF8
          }
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path out_win/* -DestinationPath dist/Free-AI-SSD-win.zip -Force
      - name: Create beta ZIP
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        shell: pwsh
        run: Compress-Archive -Path out_beta/* -DestinationPath dist/Free-AI-SSD-beta-crossplatform.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Free-AI-SSD-win
          path: dist/Free-AI-SSD-win.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        with:
          name: Free-AI-SSD-beta-crossplatform
          path: dist/Free-AI-SSD-beta-crossplatform.zip
      - name: Validate release payload
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Free-AI-SSD-win.zip")) {
            throw "Missing required release asset: dist/Free-AI-SSD-win.zip"
          }

          if ('${{ fromJSON(github.event.inputs.include_macos || 'false') }}' -eq 'true' -and -not (Test-Path "dist/Free-AI-SSD-beta-crossplatform.zip")) {
            throw "Missing required beta release asset: dist/Free-AI-SSD-beta-crossplatform.zip"
          }
      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        # Phase-A hardening (Task 4): pinned to full commit SHA of the v2 tag
        # (softprops/action-gh-release v2 → 3bb12739c298aeb8a4eeaf626c5b8d85266b0e65).
        # When bumping, resolve the new SHA via `git ls-remote` or the GitHub API
        # (refs/tags/<tag>) and update this comment + pin together.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-win.zip
          overwrite_files: true
          fail_on_unmatched_files: true
      - name: Upload beta ZIP to release
        if: github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.include_macos || 'false')
        # Phase-A hardening (Task 4): same pin as above (softprops/action-gh-release v2).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ inputs.version }}
          files: dist/Free-AI-SSD-beta-crossplatform.zip
          overwrite_files: true
          fail_on_unmatched_files: true
